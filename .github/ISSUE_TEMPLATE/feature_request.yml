name: Feature request
description: Suggest a capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and where DFM gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What DFM should do. Say how it fits the safety rules if it runs commands, uses the network or changes files.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, including doing it in RepoCanon, RepoKG or Reflex instead.
